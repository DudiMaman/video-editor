name: deploy-ui

on:
  push:
    branches: [main]
    # Data-file pushes (ledger updates, queue, suggestions) don't change the
    # UI; deploying on each one burns the ~10/hour Pages build quota and
    # stalls real UI deploys. batch.json IS included: reel videos must be
    # mirrored into the site (iOS refuses to play release assets - they are
    # served as octet-stream attachments; Pages serves real video/mp4).
    # Note: the daily workflow's own batch pushes use GITHUB_TOKEN, which
    # GitHub excludes from push triggers - that workflow dispatches this one
    # explicitly after committing new items.
    paths: ['frontend/**', '.github/workflows/pages.yml', 'data/aimodels/batch.json']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          BASE_PATH: '/${{ github.event.repository.name }}/'
      # The AI-models character references are mirrored in the
      # aimodels-roster release, but release assets are served as
      # application/octet-stream, which the Higgsfield API rejects
      # (invalid_image_url). Pages serves them as real image/png, so the
      # generation pipeline can use /refs/<char>-sheet.png as its
      # identity reference.
      - name: Include AI-models reference images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p frontend/dist/refs
          gh release download aimodels-roster -D frontend/dist/refs --clobber \
            || echo "no aimodels-roster release yet - skipping refs"

      # Reel videos play from the site itself: iOS Safari refuses release
      # assets (application/octet-stream + attachment disposition), while
      # Pages serves real video/mp4 with range support.
      - name: Include reel videos for mobile playback
        run: |
          mkdir -p frontend/dist/media
          python3 - <<'PY'
          import json, urllib.request
          batch = json.load(open('data/aimodels/batch.json'))
          n = 0
          for p in batch.get('posts', []):
              url = str(p.get('image', ''))
              if p.get('type') == 'reel' and url.endswith('.mp4'):
                  name = url.split('/')[-1]
                  req = urllib.request.Request(url, headers={'User-Agent': 'pages-media/1.0'})
                  with urllib.request.urlopen(req, timeout=120) as r:
                      open(f'frontend/dist/media/{name}', 'wb').write(r.read())
                  n += 1
                  print(name)
          print(f'{n} reel video(s) mirrored')
          PY

      # Buffer's API takes media as PUBLIC URLS ONLY and fetches them at
      # publish time (docs: hosting-media - stable, direct, https, no
      # redirects). Release assets are octet-stream behind a redirect, so
      # every ledger video a Buffer venture still needs is mirrored into
      # the site as /media/apps-<tag>-<name> (real video/mp4). The set is
      # rebuilt on every deploy (this branch is force-pushed), covering
      # entries awaiting/holding distribution plus 30 days of published
      # ones so scheduled posts never lose their media URL.
      - name: Include app videos for Buffer distribution
        run: |
          python3 - <<'PY'
          import datetime, json, urllib.request
          assets = {str(a.get('id')): a for a in json.load(open('assets.json'))}
          ledger = json.load(open('data/ledger.json'))
          keep_after = (datetime.datetime.now(datetime.timezone.utc)
                        - datetime.timedelta(days=30)).strftime('%Y-%m-%dT%H:%M:%SZ')
          n = 0
          for e in ledger:
              a = assets.get(str(e.get('asset')))
              if not a or (a.get('distributor') or 'zernio') != 'buffer':
                  continue
              out = str(e.get('output_asset') or '')
              if '/' not in out:
                  continue
              acted = (e.get('schedule') or {}).get('date') or e.get('publishNow') \
                  or e.get('zernioPostId')
              state = (e.get('distribution') or {}).get('state') or ''
              recent_pub = e.get('status') == 'published' and \
                  str(e.get('published_at') or '') >= keep_after
              pending = e.get('status') == 'approved' and acted and \
                  state != 'canceled'
              if not (pending or recent_pub):
                  continue
              tag, name = out.split('/', 1)
              dest = f"apps-{tag}-{name.replace('/', '-')}"
              url = ('https://github.com/${{ github.repository }}'
                     f'/releases/download/{tag}/{name}')
              req = urllib.request.Request(url, headers={'User-Agent': 'pages-media/1.0'})
              with urllib.request.urlopen(req, timeout=300) as r:
                  open(f'frontend/dist/media/{dest}', 'wb').write(r.read())
              n += 1
              print(dest)
          print(f'{n} app video(s) mirrored for Buffer')
          PY
      # Publishing to a gh-pages branch auto-enables GitHub Pages on public
      # repos — no admin API call needed (the workflow token can't create the
      # Pages site via the REST API).
      - name: Publish to gh-pages branch
        working-directory: frontend/dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          touch .nojekyll
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy UI from ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" gh-pages
