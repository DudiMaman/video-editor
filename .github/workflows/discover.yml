name: discover-pages

on:
  workflow_dispatch:
  schedule:
    # Daily at 03:00 UTC (06:00 Israel in summer, 05:00 in winter) so fresh
    # suggestions are waiting each morning.
    - cron: '0 3 * * *'
  push:
    branches: [main]
    paths: ['data/inbox.json']

permissions:
  contents: write

concurrency:
  group: discover
  cancel-in-progress: false

jobs:
  discover:
    # Inbox pushes trigger discovery only when pages were ADDED — removals,
    # toggles, and suggestion-accepts also touch inbox.json but re-searching
    # on each burned ~150-250k API tokens per push (the Aug 6 usage spike).
    # Schedule and manual dispatch always pass this guard.
    if: >-
      github.event_name != 'push' ||
      contains(github.event.head_commit.message, 'Scout inbox: add')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The UI play/stop toggle writes discovery_daily to data/config.json.
      # It pauses automatic runs (schedule + inbox change); manual dispatch
      # always runs.
      - name: Check automatic discovery is enabled
        if: github.event_name != 'workflow_dispatch'
        run: |
          enabled=$(jq -r 'if .discovery_daily == false then "no" else "yes" end' data/config.json)
          if [ "$enabled" = "no" ]; then
            echo "automatic discovery is paused (discovery_daily=false)"
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-python@v5
        if: env.SKIP != '1'
        with:
          python-version: '3.12'
      - if: env.SKIP != '1'
        run: pip install anthropic
      - name: Discover similar pages
        if: env.SKIP != '1'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/discover_pages.py
      - name: Commit new suggestions
        if: env.SKIP != '1'
        run: |
          if git diff --quiet data/suggestions.json; then
            echo "no new suggestions"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/suggestions.json
          git commit -m "Scout discovery: new page suggestions"
          git pull --rebase origin main
          git push origin main
