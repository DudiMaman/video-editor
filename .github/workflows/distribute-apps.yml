name: distribute-apps

# Pushes owner-approved app-marketing videos (the ledger's approved
# entries with a Gantt slot or a publish-now flag) to each app's
# Instagram through the APPS Zernio account - a separate account from
# the AI-models one, so the two projects' quotas and connections stay
# isolated. The shared driver reads ZERNIO_API_KEY, so the apps secret
# is mapped into that name here and the key never reaches the frontend.
on:
  workflow_dispatch:
  schedule:
    - cron: '41 * * * *'
  push:
    branches: [main]
    # assets.json included so wiring a venture's Zernio account
    # (or editing its details) re-runs distribution + auto-wire.
    paths: ['data/ledger.json', 'assets.json']

permissions:
  contents: write

concurrency:
  group: distribute-apps
  cancel-in-progress: false

jobs:
  distribute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # One Zernio account (and one repo secret) PER VENTURE - the free
      # tier covers ~2 connected socials per account, and each venture is
      # its own business. Onboarding a venture = create its Zernio
      # account, add the repo secret ZERNIO_KEY_<VENTURE>, and add one
      # env line here. ZERNIO_APPS_API_KEY remains as a legacy shared
      # fallback. Exits quietly while no key is configured.
      - name: Distribute approved app videos
        env:
          ZERNIO_KEY_PLANTY: ${{ secrets.ZERNIO_KEY_PLANTY }}
          ZERNIO_APPS_API_KEY: ${{ secrets.ZERNIO_APPS_API_KEY }}
          # One Buffer secret per venture (one Buffer account = one key).
          # Adding a venture to Buffer: one BUFFER_TOKEN_<VENTURE> secret
          # + one env line here + distributor: "buffer" in assets.json -
          # channels auto-wire on the first run. Zernio lines above stay
          # as the fallback for un-migrated ventures and for posts that
          # were already scheduled through Zernio.
          BUFFER_TOKEN_PLANTY: ${{ secrets.BUFFER_TOKEN_PLANTY }}
          GH_TOKEN: ${{ github.token }}
        run: python scripts/distribute_apps.py
