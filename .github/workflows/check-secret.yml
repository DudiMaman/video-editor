name: check-secret

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/check-secret.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Report ANTHROPIC_API_KEY visibility (value never printed)
        env:
          FROM_SECRETS: ${{ secrets.ANTHROPIC_API_KEY }}
          FROM_VARS: ${{ vars.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$FROM_SECRETS" ]; then
            echo "OK: repository secret ANTHROPIC_API_KEY is visible (length ${#FROM_SECRETS})"
          else
            echo "MISSING: no repository secret named ANTHROPIC_API_KEY is visible to workflows"
          fi
          if [ -n "$FROM_VARS" ]; then
            echo "NOTE: found ANTHROPIC_API_KEY under Actions VARIABLES (length ${#FROM_VARS}) - it was saved in the Variables tab instead of Secrets"
          else
            echo "no Actions variable named ANTHROPIC_API_KEY"
          fi
