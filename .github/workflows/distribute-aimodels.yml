name: distribute-aimodels

# Pushes owner-approved AI-models items to Instagram through Zernio.
# Publishing happens HERE, server-side, so ZERNIO_API_KEY never reaches
# the frontend. Triggers:
# - batch.json push: a tab save right after scheduling or "publish now"
#   (tab saves use the owner's PAT, so the push event fires normally)
# - hourly cron: status sync (scheduled -> published) and a safety net
#   for batch commits made with GITHUB_TOKEN, which don't fire push events
# - manual dispatch
on:
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'
  push:
    branches: [main]
    paths: ['data/aimodels/batch.json']

permissions:
  contents: write

concurrency:
  group: distribute-aimodels
  cancel-in-progress: false

jobs:
  distribute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Exits quietly when no distributor key is configured yet.
      # One Buffer secret per brand (Buffer Free = one API key per
      # account, one account per brand). Adding a brand to Buffer means:
      # one BUFFER_TOKEN_<BRAND> repo secret + one env line here +
      # distributor: "buffer" on the brand in roster.json - channels
      # auto-wire on the first run. ZERNIO_API_KEY stays as the fallback
      # for brands that have not migrated.
      - name: Distribute approved items
        env:
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          BUFFER_TOKEN_RUBY: ${{ secrets.BUFFER_TOKEN_RUBY }}
          GH_TOKEN: ${{ github.token }}
        run: python scripts/distribute_aimodels.py
