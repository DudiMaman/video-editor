name: daily-aimodels

on:
  workflow_dispatch:
  schedule:
    # Daily at 04:00 UTC (07:00 Israel in summer) so the fresh batch is
    # waiting for review when the day starts.
    - cron: '0 4 * * *'
  push:
    branches: [main]
    # A content-plan change (e.g. enabling stories) tops up today's batch;
    # per-day idempotency in generate_daily.py makes this duplication-safe.
    paths: ['data/aimodels/plan.json']

permissions:
  contents: write

concurrency:
  group: daily-aimodels
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install anthropic

      # Generates one pending post per character (idempotent per day) into
      # out/aimodels; images are made with Higgsfield soul/reference from
      # each character's locked sheet, and every image goes through the
      # shared persist_image (permanent release asset - Higgsfield deletes
      # its own copies after ~7 days). See scripts/generate_daily.py.
      - name: Generate today's batch
        env:
          HIGGSFIELD_API_KEY: ${{ secrets.HIGGSFIELD_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python scripts/generate_daily.py --out out/aimodels

      # Race-safe append to batch.json (reset-and-reapply with retries) so a
      # concurrent "save decisions" from the tab can't strand the commit.
      - name: Commit batch updates
        if: hashFiles('out/aimodels/new_items.json') != ''
        run: python scripts/generate_daily.py --commit --out out/aimodels
